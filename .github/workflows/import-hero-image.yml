name: Import generated homepage hero image
on:
  push:
    paths:
      - ".github/workflows/import-hero-image.yml"

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact generated hero artwork
        run: |
          mkdir -p public/images
          curl --fail --location --silent --show-error --retry 2 --max-time 80 \
            "https://at.adobe.com/9tESgDMXuyPFcUZ4" \
            --output public/images/hero-astrologer.png
          python3 - <<'PY'
          import pathlib, struct
          image = pathlib.Path("public/images/hero-astrologer.png").read_bytes()
          assert image[:8] == b"\\x89PNG\\r\\n\\x1a\\n", "Asset is not a PNG"
          width, height = struct.unpack(">II", image[16:24])
          assert (width, height) == (1672, 941), f"Unexpected image dimensions: {width}x{height}"
          print(f"Verified hero PNG: {width}x{height}, {len(image)} bytes")
          PY
      - name: Commit artwork to site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero-astrologer.png
          git commit -m "assets: add generated astrologer hero artwork"
          git push origin HEAD:main
