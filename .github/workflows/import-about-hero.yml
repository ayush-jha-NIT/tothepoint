name: Import approved About hero image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-about-hero.yml"
permissions:
  contents: write

jobs:
  import-about-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import supplied About hero PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://at.adobe.com/JsnuhSTFlN6FHgRv' \
            --output public/images/about-hero.png
          python3 - <<'PY'
          import pathlib, struct
          p = pathlib.Path("public/images/about-hero.png")
          image = p.read_bytes()
          assert image[:8] == bytes.fromhex("89504e470d0a1a0a"), "Asset is not a PNG"
          width, height = struct.unpack(">II", image[16:24])
          assert width >= 1400 and height >= 650, f"Image dimensions unexpectedly small: {width}x{height}"
          assert len(image) > 100000, "PNG appears incomplete"
          print(f"Verified About hero PNG: {width}x{height}, {len(image)} bytes")
          PY
      - name: Commit image into repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/about-hero.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: add approved About hero image"
          git push origin HEAD:main
